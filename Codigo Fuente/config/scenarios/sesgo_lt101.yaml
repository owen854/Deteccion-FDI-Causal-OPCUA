# Ataque de sesgo sigiloso sobre el nivel del tanque 1 (RF-17, RF-20, RF-22).
# LT-101 no está en el lazo de control: el ataque no altera el proceso físico, pero rompe la
# relación causal h1 → h2 que el detector espera ver.
name: sesgo_lt101
description: Sesgo constante de +1,5 cm sobre LT-101 inyectado en el gateway comprometido.
base: normal.yaml
seed: 21

attacks:
  - id: A1
    type: bias
    targets: [LT-101]
    start_s: 900
    duration_s: 300
    params: { bias: 1.5 }
    stealth: { enabled: true, envelope: [2.0, 45.0], max_rate_per_s: 0.5 }
